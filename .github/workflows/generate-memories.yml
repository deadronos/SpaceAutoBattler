name: Generate Memories

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run generator
        run: npm run generate-memories

      - name: Commit generated memories (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add memory/ || true
            git add . || true
            git commit -m "chore: update generated memories" || echo "no changes to commit"
            git push
          else
            echo "No changes in generated memories"
          fi
