name: Deploy to GitHub Pages

on:
  # Trigger deployment on tag creation (releases)
  push:
    tags:
      - 'v*'
  # Allow manual trigger for testing
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true

      - name: Install deps
        run: vp install --frozen-lockfile

      - name: Run TypeScript typecheck
        run: vp run typecheck

      - name: Run Vite Plus checks
        run: |
          vp check > vp-check.log 2>&1 || {
            cat vp-check.log
            exit 1
          }
          tail -n 20 vp-check.log

      - name: Run tests
        run: vp test

      - name: Build for production
        run: vp build

      - name: Copy spaceautobattler.html to index.html for GitHub Pages
        run: cp dist/spaceautobattler.html dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
