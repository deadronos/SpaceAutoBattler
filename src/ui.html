<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space AutoBattler UI</title>
  <link rel="stylesheet" href="./styles/ui.css">
  <style>
    /* Fallback if CSS fails to load */
    #world { position: fixed; inset: 0; display:block; }
  </style>
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b1220">
</head>
<body>
  <div id="flexRoot">
    <canvas id="world"></canvas>
  </div>
  <div id="ui">
    <button id="startPause" class="btn">▶ Start</button>
    <button id="reset" class="btn">↺ Reset</button>
    <button id="addRed" class="btn" title="Add Red ship">+ Red</button>
    <button id="addBlue" class="btn" title="Add Blue ship">+ Blue</button>
    <button id="toggleTrails" class="btn">☄ Trails: On</button>
    <div class="btn" id="speed">Speed: 1×</div>
    <div class="badge red" id="redScore">Red 0</div>
    <div class="badge blue" id="blueScore">Blue 0</div>
    <div id="stats"></div>
  </div>
  <div id="bottomRight">
    <input id="continuousCheckbox" type="checkbox" />
    <label for="continuousCheckbox" class="continuous-label">Continuous</label>
    <button id="seedBtn" class="btn" title="Re-seed RNG for reproducible battles">🎲 Seed</button>
    <button id="formationBtn" class="btn" title="Re-form fleets">🛰️ Form</button>
    <span class="muted">Space Autobattler</span>
  </div>
  <div id="toast"></div>
  <script>
    // Bootstrap asset base so worker URLs resolve correctly when the site
    // is served from repo root (assets under /dist) vs when dist is root.
    // Heuristic: if the current location contains '/dist/' assume repo-root serving.
    try {
      const href = location.href;
      if (href.includes('/dist/')) {
        // Ensure no trailing slash
        window.__ASSET_BASE__ = '/dist';
      }
    } catch (_e) { /* ignore */ }
  </script>
  <script type="module" src="../src/main.js"></script>
</body>
</html>
