<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Space Auto Battler</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, #050a17 0%, #010104 100%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #f0f6ff;
      }
      #root {
        display: flex;
        align-items: stretch;
      }
      .loading {
        margin: auto;
        font-size: 1.5rem;
        letter-spacing: 0.1rem;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading">Initializing battle simulation…</div>
    </div>
  </body>
</html>
