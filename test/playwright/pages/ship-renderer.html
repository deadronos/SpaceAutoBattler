<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ship Renderer Test Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #000;
      overflow: hidden;
      font-family: monospace;
    }
    
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    
    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      color: #0f0;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 1000;
    }
    
    #error {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #f00;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.9);
      padding: 20px;
      border-radius: 8px;
      border: 2px solid #f00;
      display: none;
      max-width: 80%;
      z-index: 2000;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/examples/jsm/loaders/GLTFLoader.js": "/node_modules/three/examples/jsm/loaders/GLTFLoader.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="status">Initializing...</div>
  <div id="error"></div>
  
  <script type="module" src="./ship-renderer.js"></script>
</body>
</html>
